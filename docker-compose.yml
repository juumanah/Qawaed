services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qawaed
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-migration-password-change-me}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qawaed"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://qawaed_app:${APP_DB_PASSWORD:-local-application-password}@db:5432/qawaed
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-local-migration-password-change-me}@db:5432/qawaed
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local-application-password}
      WORKER_DATABASE_URL: postgres://qawaed_worker:${WORKER_DB_PASSWORD:-local-worker-password-change-me}@db:5432/qawaed
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-local-worker-password-change-me}
      REGISTRY_SECRET: ${REGISTRY_SECRET:-local-registry-secret-change-me-32-chars}
      WORKER_ENABLED: "true"
      REGISTRY_URL: http://127.0.0.1:4000/mock-registry/verify
      SEED_DEMO: "true"
      PORT: "4000"
      WEB_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-QawaedDemo!2026}
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  postgres_data:
